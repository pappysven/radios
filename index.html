<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Radios</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Radios">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1e2334">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1e2334; --deep: #141826;
    --blue: #415eff; --violet: #cb45fe; --coral: #fe6a55; --pink: #f8549e; --teal: #2fd3b0;
    --grad: linear-gradient(120deg, var(--blue) 0%, var(--violet) 55%, var(--coral) 100%);
    --bg: #eef0f6; --surface: #ffffff; --line: #d9dce8; --ink: #1e2334; --muted: #646b84;
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1e2334; --surface: #282e44; --line: #363d57; --ink: #ffffff; --muted: #a3a9c2;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1e2334; --surface: #282e44; --line: #363d57; --ink: #ffffff; --muted: #a3a9c2;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "Montserrat", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  .app {
    min-height: 100%; max-width: 560px; margin: 0 auto;
    display: flex; flex-direction: column; gap: 10px; padding: 10px 14px 12px;
  }

  /* Cadran */
  .dial {
    flex: 0 0 auto; position: relative; overflow: hidden;
    background: var(--deep); color: #fff; border-radius: 26px; padding: 18px 20px 14px;
  }
  .dial::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(90% 70% at 85% -10%, rgba(203,69,254,.35), transparent 60%),
                radial-gradient(80% 60% at 0% 110%, rgba(65,94,255,.35), transparent 60%);
    opacity: .35; transition: opacity .6s ease;
  }
  .live .dial::before { opacity: 1; }
  .dial > * { position: relative; }
  .readout { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
  .freq {
    font-weight: 800; font-size: clamp(3.2rem, 15vw, 4.2rem); line-height: .9;
    letter-spacing: -.04em; font-variant-numeric: tabular-nums; color: #3b4260;
    transition: color .4s ease;
  }
  .live .freq { color: transparent; background: var(--grad); -webkit-background-clip: text; background-clip: text; }
  .freq small { font-size: .28em; font-weight: 600; letter-spacing: 0; margin-left: 6px; color: #8a91ad; -webkit-text-fill-color: #8a91ad; }
  .onair {
    font-size: .78rem; font-weight: 700; padding: 6px 10px; border-radius: 999px;
    background: #262c42; color: #8a91ad; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  }
  .onair::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .live .onair { background: rgba(254,106,85,.16); color: var(--coral); }
  .live .onair::before { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .25; } }

  .np { margin-top: 12px; min-height: 3.9em; }
  .np-show { margin: 0; font-size: 1.35rem; font-weight: 700; line-height: 1.2; letter-spacing: -.01em;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .np-sub { margin: 6px 0 0; font-size: .98rem; font-weight: 500; color: #b4bad1; line-height: 1.35;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  .scale { position: relative; height: 46px; margin-top: 10px; }
  .ticks { position: absolute; top: 0; bottom: 18px; display: flex; justify-content: space-between; align-items: flex-end; }
  .ticks i { width: 1px; height: 7px; background: #3b4260; }
  .ticks i.major { height: 15px; background: #6d7494; }
  .labels { position: absolute; left: 0; right: 0; bottom: 0; height: 14px; font-size: .7rem; font-weight: 600; color: #6d7494; }
  .labels span { position: absolute; transform: translateX(-50%); }
  .mark { position: absolute; top: -2px; width: 7px; height: 7px; border-radius: 50%; transform: translateX(-50%); }
  .needle {
    position: absolute; top: -8px; bottom: 14px; width: 4px; border-radius: 2px;
    background: linear-gradient(var(--coral), var(--violet));
    box-shadow: 0 0 12px rgba(254,106,85,.7);
    left: 50%; transform: translateX(-50%); opacity: .4;
    transition: left 1.1s cubic-bezier(.3,1.35,.5,1), opacity .4s;
  }
  .live .needle { opacity: 1; }

  /* Stations */
  .stations { flex: 1 1 auto; min-height: 0; display: grid; grid-template-rows: repeat(5, 1fr); gap: 8px; }
  .st {
    position: relative; overflow: hidden; min-height: 80px;
    border: 0; border-radius: 24px; background: var(--surface); color: var(--ink);
    padding: 10px 18px 10px 24px; text-align: left; cursor: pointer; font-family: inherit;
    display: flex; flex-direction: column; justify-content: space-between; gap: 6px;
    box-shadow: 0 0 0 1px var(--line) inset;
    transition: transform .12s ease;
  }
  .st::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 8px; background: var(--c); }
  .st::after {
    content: ""; position: absolute; inset: 0; background: var(--grad);
    opacity: 0; transition: opacity .35s ease;
  }
  .st > * { position: relative; z-index: 1; }
  .st:active { transform: scale(.985); }
  .st:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
  .st.on { color: #fff; box-shadow: none; }
  .st.on::after { opacity: 1; }
  .st-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .st-name { font-weight: 800; font-size: clamp(1.55rem, 7.2vw, 2.1rem); line-height: 1; letter-spacing: -.035em; }
  .st-f { font-weight: 700; font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .st.on .st-f { color: rgba(255,255,255,.85); }
  .st-np { display: block; font-size: .88rem; line-height: 1.3; color: var(--muted); }
  .st-np b { display: block; font-weight: 700; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .st-np span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .st.on .st-np, .st.on .st-np b { color: #fff; }
  .bars { display: none; gap: 3px; align-items: flex-end; height: 18px; }
  .bars i { width: 4px; background: #fff; border-radius: 2px; height: 40%; animation: b .9s ease-in-out infinite; }
  .bars i:nth-child(2) { animation-delay: .2s; } .bars i:nth-child(3) { animation-delay: .4s; }
  .st.on .bars { display: inline-flex; }
  .st.on .st-f { display: none; }
  @keyframes b { 0%,100% { height: 25%; } 50% { height: 100%; } }
  .st[data-k="info"]  { --c: var(--blue); }
  .st[data-k="inter"] { --c: var(--coral); }
  .st[data-k="culture"] { --c: var(--pink); }
  .st[data-k="fip"] { --c: var(--teal); }
  .st[data-k="nova"]  { --c: var(--violet); }

  .stop {
    flex: 0 0 auto; min-height: 62px; border-radius: 22px; cursor: pointer; border: 0;
    background: var(--coral); color: #fff;
    font: 800 1.2rem "Montserrat", system-ui, sans-serif; letter-spacing: -.01em;
    display: inline-flex; align-items: center; justify-content: center; gap: 12px;
    box-shadow: 0 10px 24px -10px rgba(254,106,85,.8);
    transition: transform .12s ease, background .3s ease, box-shadow .3s ease, color .3s ease;
  }
  .stop::before { content: ""; width: 16px; height: 16px; border-radius: 4px; background: currentColor; }
  .stop:active { transform: scale(.98); }
  .stop:disabled { background: var(--surface); color: var(--muted); box-shadow: 0 0 0 1px var(--line) inset; cursor: default; }
  .stop:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) {
    .needle { transition: none; }
    .bars i, .live .onair::before { animation: none; }
    .bars i { height: 70%; }
  }
</style>
</head>
<body>
<main class="app" id="app">
  <section class="dial" aria-label="Cadran">
    <div class="readout">
      <div class="freq" id="freq">——,—<small>MHz</small></div>
      <span class="onair" id="onair">Hors antenne</span>
    </div>
    <div class="np" aria-live="polite">
      <p class="np-show" id="npShow">Choisis une station</p>
      <p class="np-sub" id="npSub">Touche une radio pour l’écouter.</p>
    </div>
    <div class="scale" id="scale">
      <div class="ticks" id="ticks"></div>
      <div class="labels" id="labels"></div>
      <div class="needle" id="needle"></div>
    </div>
  </section>

  <div class="stations">
    <button class="st" data-k="info" data-name="France Info" data-f="105.5" data-src="https://icecast.radiofrance.fr/franceinfo-midfi.mp3">
      <span class="st-top"><span class="st-name">France Info</span><span class="st-f">105,5</span><span class="bars"><i></i><i></i><i></i></span></span>
      <span class="st-np"><b>…</b><span></span></span>
    </button>
    <button class="st" data-k="inter" data-name="France Inter" data-f="87.8" data-src="https://icecast.radiofrance.fr/franceinter-midfi.mp3">
      <span class="st-top"><span class="st-name">France Inter</span><span class="st-f">87,8</span><span class="bars"><i></i><i></i><i></i></span></span>
      <span class="st-np"><b>…</b><span></span></span>
    </button>
    <button class="st" data-k="culture" data-name="France Culture" data-f="93.5" data-src="https://icecast.radiofrance.fr/franceculture-midfi.mp3">
      <span class="st-top"><span class="st-name">France Culture</span><span class="st-f">93,5</span><span class="bars"><i></i><i></i><i></i></span></span>
      <span class="st-np"><b>…</b><span></span></span>
    </button>
    <button class="st" data-k="fip" data-name="FIP" data-f="105.1" data-src="https://icecast.radiofrance.fr/fip-midfi.mp3">
      <span class="st-top"><span class="st-name">FIP</span><span class="st-f">105,1</span><span class="bars"><i></i><i></i><i></i></span></span>
      <span class="st-np"><b>…</b><span></span></span>
    </button>
    <button class="st" data-k="nova" data-name="Radio Nova" data-f="101.5" data-src="https://novazz.ice.infomaniak.ch/novazz-128.mp3">
      <span class="st-top"><span class="st-name">Radio Nova</span><span class="st-f">101,5</span><span class="bars"><i></i><i></i><i></i></span></span>
      <span class="st-np"><b>…</b><span></span></span>
    </button>
  </div>

  <button class="stop" id="stop" disabled>Arrêter</button>
</main>

<script>
  const MIN = 87.5, MAX = 108;
  const pos = f => ((f - MIN) / (MAX - MIN)) * 100;
  const $ = id => document.getElementById(id);
  const app = $('app'), freq = $('freq'), onair = $('onair'), npShow = $('npShow'), npSub = $('npSub'),
        stopBtn = $('stop'), needle = $('needle');
  const cards = [...document.querySelectorAll('.st')];
  const audio = new Audio();
  audio.preload = 'none';
  const meta = { info: null, inter: null, culture: null, fip: null, nova: null };
  let current = null;

  // Graduations du cadran
  const ticks = $('ticks');
  for (let f = 88; f <= 108; f++) {
    const i = document.createElement('i');
    if (f % 4 === 0) i.className = 'major';
    ticks.appendChild(i);
  }
  ticks.style.left = pos(88) + '%'; ticks.style.right = (100 - pos(108)) + '%';
  [88, 92, 96, 100, 104, 108].forEach(f => {
    const s = document.createElement('span'); s.textContent = f; s.style.left = pos(f) + '%'; $('labels').appendChild(s);
  });
  cards.forEach(c => {
    const m = document.createElement('span'); m.className = 'mark';
    m.style.left = pos(+c.dataset.f) + '%'; m.style.background = getComputedStyle(c).getPropertyValue('--c');
    $('scale').insertBefore(m, needle);
  });

  // Titres en cours
  const nice = s => {
    if (!s) return '';
    s = String(s).trim();
    if (s === s.toUpperCase() && /[A-Z]/.test(s)) s = s.toLowerCase().replace(/(^|[\s'’(\-\/])(\p{L})/gu, (m, a, b) => a + b.toUpperCase());
    return s;
  };

  async function radioFrance(id) {
    const r = await fetch('https://api.radiofrance.fr/livemeta/pull/' + id, { cache: 'no-store' });
    const d = await r.json();
    const now = Date.now() / 1000;
    const steps = (d.levels || []).map(L => d.steps[L.items[L.position]]).filter(s => s && s.end > now - 60);
    if (!steps.length) return null;
    const top = steps[0], last = steps[steps.length - 1];
    const show = top.titleConcept || top.title || '';
    let sub = '';
    if (last !== top) {
      const who = typeof last.authors === 'string' && last.authors ? last.authors : (typeof last.performers === 'string' && last.performers ? last.performers : '');
      sub = who ? who + ' – ' + last.title : last.title;
    } else if (top.titleConcept && top.title && top.title !== top.titleConcept) {
      sub = top.title;
    }
    return { show: nice(show), sub: nice(sub) };
  }

  async function nova() {
    const r = await fetch('https://www.nova.fr/radios-data/www.nova.fr/all.json', { cache: 'no-store' });
    const d = await r.json();
    const e = d.find(x => x.radio && x.radio.code === 'radio-nova');
    if (!e) return null;
    const show = e.currentShow ? (e.currentShow.title || e.currentShow.name || '') : '';
    const t = e.currentTrack;
    const track = t ? nice(t.artist) + ' – ' + nice(t.title) : '';
    return show ? { show: nice(show), sub: track } : { show: track || 'Radio Nova', sub: track ? 'En ce moment sur Nova' : '' };
  }

  const fetchers = { info: () => radioFrance(2), inter: () => radioFrance(1), culture: () => radioFrance(5), fip: () => radioFrance(7), nova };

  function paintCard(k) {
    const c = cards.find(x => x.dataset.k === k), m = meta[k];
    const b = c.querySelector('.st-np b'), s = c.querySelector('.st-np span');
    b.textContent = m ? m.show : 'Programme indisponible';
    s.textContent = m && m.sub ? m.sub : '';
  }

  function paintDial() {
    if (!current) return;
    const m = meta[current.dataset.k];
    npShow.textContent = m ? m.show : current.dataset.name;
    npSub.textContent = m && m.sub ? m.sub : 'En direct';
    if ('mediaSession' in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: m ? (m.sub || m.show) : current.dataset.name,
        artist: m && m.sub ? m.show : current.dataset.name,
        album: current.dataset.name,
        artwork: [{ src: 'apple-touch-icon.png', sizes: '180x180', type: 'image/png' }]
      });
    }
  }

  async function refresh(k) {
    try { meta[k] = await fetchers[k](); } catch (e) { /* on garde la dernière valeur */ }
    paintCard(k);
    if (current && current.dataset.k === k) paintDial();
  }
  const refreshAll = () => Object.keys(fetchers).forEach(refresh);
  refreshAll();
  setInterval(() => { if (!document.hidden) refreshAll(); }, 30000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshAll(); });

  // Lecture
  function show(c) {
    current = c;
    cards.forEach(x => x.classList.toggle('on', x === c));
    app.classList.toggle('live', !!c);
    stopBtn.disabled = !c;
    if (c) {
      needle.style.left = pos(+c.dataset.f) + '%';
      freq.innerHTML = c.dataset.f.replace('.', ',') + '<small>MHz</small>';
      onair.textContent = 'Connexion…';
      paintDial();
    } else {
      needle.style.left = '50%';
      freq.innerHTML = '——,—<small>MHz</small>';
      onair.textContent = 'Hors antenne';
      npShow.textContent = 'Choisis une station';
      npSub.textContent = 'Touche une radio pour l’écouter.';
    }
  }

  function stop() {
    audio.pause(); audio.removeAttribute('src'); audio.load();
    show(null);
  }

  cards.forEach(c => c.addEventListener('click', async () => {
    if (c === current) { stop(); return; }
    audio.pause(); audio.src = c.dataset.src;
    show(c);
    refresh(c.dataset.k);
    try { await audio.play(); onair.textContent = 'En direct'; }
    catch (e) { show(null); npSub.textContent = 'Impossible de lancer ' + c.dataset.name + '. Réessaie.'; }
  }));
  stopBtn.addEventListener('click', stop);

  audio.addEventListener('playing', () => { if (current) onair.textContent = 'En direct'; });
  audio.addEventListener('waiting', () => { if (current) onair.textContent = 'Connexion…'; });
  audio.addEventListener('error', () => {
    if (!current) return;
    const n = current.dataset.name;
    show(null); npSub.textContent = 'Le flux de ' + n + ' ne répond pas. Réessaie dans un instant.';
  });

  if ('mediaSession' in navigator) {
    navigator.mediaSession.setActionHandler('pause', stop);
    navigator.mediaSession.setActionHandler('stop', stop);
  }
</script>
</body>
</html>
