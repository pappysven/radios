<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Radios</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Radios">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;800&family=Instrument+Sans:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --body: #d9ddd6; --panel: #c4cabf; --panel-edge: #a9b0a3;
    --glass: #1c2421; --glow: #ffb547; --glow-soft: rgba(255,181,71,.18);
    --needle: #ff4b2b; --key: #f4f3ee; --key-edge: #b8bcb2; --key-ink: #26302c;
    --ink: #26302c; --muted: #5d6862;
    --info: #f2c200; --inter: #e2001a; --nova: #6a3cf0;
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --body: #121816; --panel: #1d2522; --panel-edge: #2c3632;
      --glass: #0a0e0d; --key: #2a3430; --key-edge: #3a4641; --key-ink: #e9ece6;
      --ink: #e9ece6; --muted: #8e9a94; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --body: #121816; --panel: #1d2522; --panel-edge: #2c3632;
    --glass: #0a0e0d; --key: #2a3430; --key-edge: #3a4641; --key-ink: #e9ece6;
    --ink: #e9ece6; --muted: #8e9a94; color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--body); color: var(--ink);
    font-family: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    display: grid; place-items: center; padding: 18px;
  }
  .set {
    width: 100%; max-width: 520px;
    background: var(--panel); border: 1px solid var(--panel-edge);
    border-radius: 28px; padding: 22px 20px 20px;
    box-shadow: 0 1px 0 rgba(255,255,255,.35) inset, 0 24px 50px -28px rgba(0,0,0,.45);
  }

  /* Cadran */
  .dial {
    position: relative; background: var(--glass); border-radius: 16px;
    padding: 18px 16px 14px; overflow: hidden;
    box-shadow: 0 2px 10px rgba(0,0,0,.5) inset;
  }
  .dial::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(120% 90% at 50% 120%, var(--glow-soft), transparent 60%);
    opacity: 0; transition: opacity .6s ease;
  }
  .live .dial::after { opacity: 1; }
  .readout { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .freq {
    font-family: "Big Shoulders Display", "Arial Narrow", sans-serif; font-weight: 800;
    font-size: clamp(3.4rem, 17vw, 4.6rem); line-height: .9; letter-spacing: .01em;
    color: #4a524e; transition: color .4s ease, text-shadow .4s ease;
    font-variant-numeric: tabular-nums;
  }
  .live .freq { color: var(--glow); text-shadow: 0 0 18px rgba(255,181,71,.45); }
  .freq small { font-size: .32em; font-weight: 500; margin-left: 4px; }
  .now { text-align: right; color: #8b948f; font-size: .95rem; line-height: 1.3; }
  .now strong { display: block; color: #e9ece6; font-size: 1.15rem; font-weight: 600; }

  .scale { position: relative; height: 54px; margin-top: 16px; }
  .ticks { position: absolute; inset: 0 0 18px; display: flex; justify-content: space-between; align-items: flex-end; }
  .ticks i { width: 1px; height: 8px; background: #59625d; }
  .ticks i.major { height: 16px; background: #8b948f; }
  .labels { position: absolute; left: 0; right: 0; bottom: 0; height: 14px;
    font-family: "Big Shoulders Display", "Arial Narrow", sans-serif; font-size: .8rem; color: #8b948f; }
  .labels span { position: absolute; transform: translateX(-50%); }
  .mark { position: absolute; top: 0; width: 8px; height: 8px; border-radius: 50%; transform: translateX(-50%); }
  .needle {
    position: absolute; top: -6px; bottom: 14px; width: 3px; border-radius: 2px;
    background: var(--needle); box-shadow: 0 0 10px rgba(255,75,43,.7);
    left: 50%; transform: translateX(-50%);
    transition: left 1.1s cubic-bezier(.3,1.35,.5,1);
  }
  @media (prefers-reduced-motion: reduce) { .needle { transition: none; } }

  /* Touches */
  .keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 18px; }
  .key {
    position: relative; border: 1px solid var(--key-edge); background: var(--key); color: var(--key-ink);
    border-radius: 14px; padding: 18px 10px 16px; cursor: pointer;
    font: 600 1rem/1.15 inherit; text-align: center;
    box-shadow: 0 6px 0 var(--key-edge), 0 8px 14px -6px rgba(0,0,0,.35);
    transform: translateY(0); transition: transform .1s ease, box-shadow .1s ease;
  }
  .key::before {
    content: ""; display: block; width: 26px; height: 5px; border-radius: 3px;
    margin: 0 auto 12px; background: var(--c); opacity: .5; transition: opacity .2s, box-shadow .2s;
  }
  .key.on { transform: translateY(5px); box-shadow: 0 1px 0 var(--key-edge), 0 2px 4px -2px rgba(0,0,0,.35); }
  .key.on::before { opacity: 1; box-shadow: 0 0 10px var(--c); }
  .key:focus-visible, .stop:focus-visible { outline: 3px solid var(--needle); outline-offset: 3px; }
  .key[data-k="info"]  { --c: var(--info); }
  .key[data-k="inter"] { --c: var(--inter); }
  .key[data-k="nova"]  { --c: var(--nova); }

  .bottom { display: flex; align-items: center; justify-content: space-between; margin-top: 18px; gap: 12px; }
  .status { margin: 0; color: var(--muted); font-size: .9rem; }
  .stop {
    border: 1px solid var(--key-edge); background: transparent; color: var(--ink);
    border-radius: 999px; padding: 10px 18px; cursor: pointer; font: 600 .95rem inherit;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .stop::before { content: ""; width: 10px; height: 10px; border-radius: 2px; background: currentColor; }
  .stop:disabled { opacity: .4; cursor: default; }
</style>
</head>
<body>
<main class="set" id="set">
  <div class="dial">
    <div class="readout">
      <div class="freq" id="freq">——,—<small>MHz</small></div>
      <div class="now" id="now"><strong>Silence</strong>choisis une station</div>
    </div>
    <div class="scale" id="scale">
      <div class="ticks" id="ticks"></div>
      <div class="labels" id="labels"></div>
      <div class="needle" id="needle"></div>
    </div>
  </div>

  <div class="keys">
    <button class="key" data-k="info"  data-name="France Info"  data-f="105.5" data-src="https://icecast.radiofrance.fr/franceinfo-midfi.mp3">France Info</button>
    <button class="key" data-k="inter" data-name="France Inter" data-f="87.8"  data-src="https://icecast.radiofrance.fr/franceinter-midfi.mp3">France Inter</button>
    <button class="key" data-k="nova"  data-name="Radio Nova"   data-f="101.5" data-src="https://novazz.ice.infomaniak.ch/novazz-128.mp3">Radio Nova</button>
  </div>

  <div class="bottom">
    <p class="status" id="status" aria-live="polite">Prête</p>
    <button class="stop" id="stop" disabled>Arrêter</button>
  </div>
</main>

<script>
  const MIN = 87.5, MAX = 108;
  const pos = f => ((f - MIN) / (MAX - MIN)) * 100;
  const $ = id => document.getElementById(id);
  const set = $('set'), freq = $('freq'), now = $('now'), status = $('status'), stopBtn = $('stop'), needle = $('needle');
  const keys = document.querySelectorAll('.key');
  const audio = new Audio();

  // Graduations
  const ticks = $('ticks');
  for (let f = 88; f <= 108; f++) {
    const i = document.createElement('i');
    if (f % 4 === 0) i.className = 'major';
    ticks.appendChild(i);
  }
  ticks.style.left = pos(88) + '%'; ticks.style.right = (100 - pos(108)) + '%';
  const labels = $('labels');
  [88, 92, 96, 100, 104, 108].forEach(f => {
    const s = document.createElement('span'); s.textContent = f; s.style.left = pos(f) + '%'; labels.appendChild(s);
  });
  keys.forEach(k => {
    const m = document.createElement('span'); m.className = 'mark';
    m.style.left = pos(+k.dataset.f) + '%'; m.style.background = getComputedStyle(k).getPropertyValue('--c');
    $('scale').appendChild(m);
  });

  function show(k) {
    keys.forEach(b => b.classList.toggle('on', b === k));
    set.classList.toggle('live', !!k);
    stopBtn.disabled = !k;
    if (k) {
      needle.style.left = pos(+k.dataset.f) + '%';
      freq.innerHTML = k.dataset.f.replace('.', ',') + '<small>MHz</small>';
      now.innerHTML = '<strong>' + k.dataset.name + '</strong>en direct';
    } else {
      needle.style.left = '50%';
      freq.innerHTML = '——,—<small>MHz</small>';
      now.innerHTML = '<strong>Silence</strong>choisis une station';
    }
  }

  keys.forEach(k => k.addEventListener('click', async () => {
    if (k.classList.contains('on')) return;
    audio.pause(); audio.src = k.dataset.src;
    show(k);
    status.textContent = 'Connexion…';
    try { await audio.play(); status.textContent = 'À l’écoute'; }
    catch (e) { show(null); status.textContent = 'Impossible de lancer ' + k.dataset.name + '. Réessaie.'; }
  }));

  stopBtn.addEventListener('click', () => {
    audio.pause(); audio.removeAttribute('src'); audio.load();
    show(null); status.textContent = 'Prête';
  });

  audio.addEventListener('error', () => {
    if (!set.classList.contains('live')) return;
    show(null); status.textContent = 'Le flux ne répond pas. Réessaie dans un instant.';
  });
</script>
</body>
</html>
